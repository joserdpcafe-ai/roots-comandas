<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comandas Roots</title>
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comandas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<style>/* Las letras van dentro del sitio (14 nov 2026): Comandas no cambia de letra si se cae la señal. Las copia armar.py. */
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/figtree-latin-normal.woff2) format('woff2')}
@font-face{font-family:'Gloock';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/gloock-latin-400-normal.woff2) format('woff2')}
</style>
<style>
/* Una sola mano, un teléfono, en servicio: filas grandes, total siempre a la vista, barra de acciones abajo. Mismo negro y dorado de la carta. */
:root{--bg:#050505;--sup:#120F0A;--fg:#F4E8D0;--fg2:#CFC4AB;--mute:#948C7A;--gold:#D4B06A;--gold-hi:#F0D78C;--blue:#7CB8F5;--ok:#8FCB9B;--mal:#E89A8B;--line:rgba(212,176,106,.28);--line-hi:rgba(212,176,106,.7);--f-t:"Cormorant Garamond",Georgia,serif;--f-x:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--f-x);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 340px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font:600 26px/1.1 var(--f-t);flex:1;min-width:0;text-wrap:balance}
.atras{width:44px;height:44px;margin-left:-10px;font-size:24px;color:var(--gold)}
.modo{font-size:12px;font-weight:600;padding:4px 10px;border:1px solid currentColor;border-radius:99px;white-space:nowrap}
.modo.linea{color:var(--ok)}.modo.fuera{color:var(--mal)}
.aviso{margin:12px 0 0;padding:10px 12px;border:1px solid var(--blue);font-size:14px;color:var(--fg2)}
.et{margin:20px 0 8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.vacio{padding:28px 0;text-align:center;color:var(--fg2)}
.b1,.b2{display:block;width:100%;min-height:52px;padding:12px 16px;text-align:center;text-decoration:none;font-weight:600;font-size:17px}
.b1{background:var(--gold);color:#0C0C0C}
.b2{border:1px solid var(--line-hi);color:var(--gold-hi)}
.b3{min-height:44px;padding:8px 12px;color:var(--gold-hi);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.peligro{color:var(--mal)}
.seg{display:flex;gap:6px;margin-top:14px}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);color:var(--fg2);font-weight:500}
.seg button.on{background:var(--sup);border-color:var(--gold);color:var(--gold-hi)}
.fila{display:flex;width:100%;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.fila>div:first-child{flex:1;min-width:0}
.fila b{font-weight:600;font-size:18px}
.fila small{display:block;color:var(--mute);font-size:13.5px}
.din{font-variant-numeric:tabular-nums;font-weight:600;color:var(--gold-hi);white-space:nowrap}
.est{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border:1px solid currentColor;border-radius:99px;white-space:nowrap}
.est.esp{color:var(--gold-hi)}.est.ok{color:var(--ok)}.est.cor{color:var(--blue)}
.pie{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sup);border-top:1px solid var(--line-hi);padding-bottom:env(safe-area-inset-bottom,0px)}
.pie>div{max-width:640px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.pie>.nav{padding:0;border-top:1px solid var(--line)}
.nav{display:flex;max-width:640px;margin:0 auto}
.nav button{flex:1;min-height:56px;font-size:13.5px;font-weight:600;color:var(--mute);border-top:2px solid transparent}
.nav button.on{color:var(--gold-hi);border-top-color:var(--gold)}
.nav i{font-style:normal;background:var(--gold);color:#0C0C0C;border-radius:99px;padding:0 6px;margin-left:4px;font-size:12px}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mesas button{min-height:60px;border:1px solid var(--line);padding:6px;font-weight:600}
.mesas button.ocu{border-color:var(--gold);background:var(--sup);color:var(--gold-hi)}
.mesas small{display:block;font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
input[type=text],input[type=search],input[type=tel]{width:100%;min-height:48px;padding:10px 12px;background:var(--sup);border:1px solid var(--line-hi);border-radius:0;font-size:16px}
.lab{display:block;margin-top:14px;font-size:14px;color:var(--fg2)}
.lab input{margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.chips button{flex:none;min-height:40px;padding:6px 12px;border:1px solid var(--line);font-size:14px;color:var(--fg2)}
.chips button.on{border-color:var(--gold);color:var(--gold-hi);background:var(--sup)}
.pr{padding:10px 0;border-bottom:1px solid var(--line)}
.pr-f{display:flex;align-items:center;gap:10px}
.pr-f>div:first-child{flex:1;min-width:0}
.pr-f small{display:block;color:var(--mute);font-variant-numeric:tabular-nums}
.pr.a{opacity:.5}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:46px;height:46px;border:1px solid var(--line-hi);font-size:22px;color:var(--gold-hi)}
.step output{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.pr input{margin-top:8px;min-height:40px;font-size:15px}
.ronda{margin-top:18px}
.ronda h3{margin:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:center;font-size:13.5px;font-weight:600;color:var(--fg2)}
.lin{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.lin>div:first-child{flex:1;min-width:0}
.lin small{display:block;color:var(--blue)}
.lin.x{opacity:.5;text-decoration:line-through}
.quita{width:40px;height:40px;color:var(--mute);font-size:16px;flex:none}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0;color:var(--fg2);font-size:15px}
.tot.g{color:var(--fg);align-items:center;padding-top:6px}
.tot.g b{font:600 34px/1 var(--f-t);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.tip{display:flex;align-items:center;gap:8px;min-height:40px}
.tip input{width:20px;height:20px;accent-color:var(--gold)}
.acc{display:grid;gap:8px;margin-top:8px}
.pago{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pago button{min-height:52px;border:1px solid var(--gold);color:var(--gold-hi);font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.cf{padding:10px 12px;border:1px solid var(--mal);margin-top:8px}
.tarj{margin-top:14px;padding:12px 14px;background:var(--sup);border:1px solid var(--line)}
.tarj.cobro{border-color:var(--gold)}
.tarj h2{margin:0;font:600 24px/1.1 var(--f-t);color:var(--gold-hi)}
.tarj p{margin:2px 0 8px;color:var(--mute);font-size:13.5px}
.acceso{padding-top:28px}
.marca{font:600 34px/1.1 var(--f-t);margin:0}
.sub{color:var(--fg2);margin:6px 0 18px}
.puntos{display:flex;justify-content:center;gap:14px;margin:18px 0;min-height:16px}
.puntos i{width:16px;height:16px;background:var(--gold);border-radius:50%}
.tec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:320px;margin:0 auto}
.tec button{height:64px;border:1px solid var(--line-hi);font-size:24px;font-weight:500}
.tec button.ent{background:var(--gold);color:#0C0C0C;font-size:17px;font-weight:600;border:0}
.err{color:var(--mal);text-align:center;min-height:22px;margin:0 0 8px}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.kpi.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi div small{display:block;color:var(--mute);font-size:13px}
.kpi div b{font:600 28px/1.1 var(--f-t);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.navm{display:flex;align-items:center;gap:8px;margin-top:12px}.navm b{flex:1;text-align:center;text-transform:capitalize}.navm button{flex:none;width:52px;min-height:48px;border:1px solid var(--line-hi);color:var(--gold-hi);font-size:20px}.navm button:disabled{opacity:.35}
.fn{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.nota{margin-top:18px;font-size:13.5px;color:var(--fg2)}
.graf{display:block;width:100%;height:auto;margin-top:10px;border:1px solid var(--line);background:var(--sup)}
.medios{height:14px;margin:8px 0 10px;border:1px solid var(--line);background:var(--blue);display:flex}.medios i{display:block;background:var(--gold)}
textarea{width:100%;background:var(--sup);border:1px solid var(--line-hi)}
.det{border-bottom:1px solid var(--line);padding:4px 0}
.det summary{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:42px;cursor:pointer;list-style:none;color:var(--fg2);font-size:15px}
.det summary::-webkit-details-marker{display:none}
input[type=tel].num{width:112px;flex:none;margin-top:0;text-align:right}
#alerta{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:12;max-width:560px;margin:0 auto;display:grid;gap:6px}
#alerta:empty{display:none}
.alerta{max-height:72vh;overflow:auto;padding:12px 14px;background:var(--gold);color:#0C0C0C;box-shadow:0 10px 30px rgba(0,0,0,.65)}
.alerta .tipo{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.alerta h2{margin:2px 0 0;font:600 32px/1.1 var(--f-t)}
.alerta .quien{margin:2px 0 8px;font-size:14px}
.alerta .linea{padding:5px 0;border-top:1px solid rgba(0,0,0,.25);font-weight:500}
.alerta .linea small{display:block;font-weight:400}
.alerta .bot{display:grid;grid-template-columns:2fr 1fr;gap:6px;margin-top:10px}
.alerta .bot button{min-height:52px;font-weight:600;font-size:16px}
.alerta .ya{background:#0C0C0C;color:var(--gold-hi)}
.alerta .luego{border:1px solid #0C0C0C;color:#0C0C0C}
.al-son{width:100%;min-height:44px;padding:8px 12px;background:var(--sup);border:1px solid var(--blue);color:var(--blue);font-weight:600;font-size:14.5px}
.toast{position:fixed;left:16px;right:16px;top:calc(68px + env(safe-area-inset-top,0px));z-index:9;max-width:520px;margin:0 auto;padding:12px 14px;background:var(--gold);color:#0C0C0C;font-weight:600;text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:ent .18s ease-out}@keyframes ent{from{transform:translateY(-8px);opacity:0}}}
input[type=password],select{width:100%;min-height:48px;padding:10px 12px;background:var(--sup);border:1px solid var(--line-hi);border-radius:0;font-size:16px;color:var(--fg)}
select{margin-top:6px}
option{background:#120F0A;color:#F4E8D0}
textarea{padding:10px 12px;min-height:96px;border-radius:0;font-size:16px;resize:vertical}
.lab textarea{margin-top:6px}
.est.mal{color:var(--mal)}
.nav.d5 button{font-size:12.5px;padding:0 2px;line-height:1.15}
.nav.d5 i{margin-left:3px;padding:0 5px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.cas{display:flex;align-items:center;gap:10px;min-height:44px}
.cas input{width:22px;height:22px;accent-color:var(--gold);flex:none}
.tarj input[type=text]{margin-top:8px}
/* ===== Personalidad Roots (5 nov 2026): la misma dirección de la carta «Láminas del lago». Solo cambia cómo se ve: familia B (Gloock + Figtree), negro, marfil y dorado, filetes, el logo y un dibujo de línea. Ningún texto, precio ni dato cambia. ===== */
:root{--bg:#0C0C0C;--sup:#000000;--fg2:rgba(244,232,208,.86);--mute:rgba(244,232,208,.66);--gold-hi:#D4B06A;--azul:#118CFF;--f-t:"Gloock",Georgia,"Times New Roman",serif;--f-x:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
::selection{background:var(--gold);color:#000}
.top h1,.tot.g b,.tarj h2,.marca,.kpi div b,.alerta h2{font-weight:400}
.top h1{font-size:25px;letter-spacing:-.005em}
.lg{width:34px;height:34px;flex:none;border-radius:50%}
.et{display:flex;align-items:center;gap:12px;letter-spacing:.22em}
.et::before{content:"";flex:none;width:26px;height:1px;background:currentColor}
.et::after{content:"";flex:1;height:1px;background:var(--line)}
.logo-acc{display:block;width:118px;height:118px;margin:4px 0 14px;border-radius:50%}
.marca{font-size:38px;letter-spacing:-.005em}
.acceso .marca::after{content:"";display:block;width:56px;height:1px;margin-top:12px;background:var(--gold)}
.mesh{display:flex;align-items:center;gap:14px;margin-top:6px}
.mesh p{margin:0}
.lam{flex:none;width:76px;height:76px;opacity:.9}
.medios{background:var(--azul)}
.kpi div{border-top:1px solid var(--line);padding-top:8px}

/* ===== Paso 7, grupo B, cambio 1 · letra de 16 px (aprobado por Roots el 14 nov 2026). Solo aspecto. ===== */
.aviso,.lab,.fila small,.tarj p,.kpi div small,.nota,.alerta .quien,.b3,.chips button,.pr input,.ronda h3,.tot,.pago button,.det summary,.al-son{font-size:16px}
.mesas small{font-size:14px}
.modo,.est,.et,.alerta .tipo,.nav i{font-size:14px}
.et{letter-spacing:.18em}
.nav button,.nav.d5 button{font-size:14px}

/* ===== Paso 7, grupo B, cambio 3 · inicio del dueño con jerarquía (aprobado por Roots el 14 nov 2026). Solo aspecto. ===== */
.ini-p{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 16px;width:100%;margin-top:18px;padding:18px 18px 16px;border:1px solid var(--gold);background:var(--sup);color:var(--fg);text-align:left;cursor:pointer}
.ini-p small{grid-column:1/-1;font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.ini-p b{font:400 64px/1 var(--f-t);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.ini-p span{align-self:center;font-size:17px;color:var(--fg)}
.ini-p span.urg{color:var(--gold-hi);font-weight:600}
.ini-p em{grid-column:1/-1;margin-top:12px;padding:13px 16px;background:var(--gold);color:#0C0C0C;font:600 16px/1.2 var(--f-x);font-style:normal;text-align:center}
.ini-p.cero{border-color:var(--line-hi)}
.ini-p.cero em{background:none;border:1px solid var(--line-hi);color:var(--gold-hi)}
.ini-rev{margin:8px 0 0;font-size:16px;color:var(--mute)}
.ini-s{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ini-s button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:96px;padding:14px 16px;border:1px solid var(--line-hi);background:none;color:var(--fg);text-align:left;cursor:pointer}
.ini-s small{font-size:16px;color:var(--fg2)}
.ini-s b{font:400 28px/1 var(--f-t);color:var(--gold-hi)}
.ini-ls{display:grid;margin-top:0;border-top:1px solid var(--line)}
.ini-ls a,.ini-ls button{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:0 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:400 17px/1.2 var(--f-x);text-align:left;text-decoration:none;cursor:pointer}
.ini-ls i{font-style:normal;color:var(--gold);font-size:18px}
.ini-p:active,.ini-s button:active,.ini-ls a:active,.ini-ls button:active{background:rgba(212,176,106,.1)}
/* Pedido (lista de requerimiento) */
.rq-pv{margin-top:6px;border-top:1px solid var(--line-hi);padding:12px 0}
.rq-f{align-items:flex-start;padding:12px 0 12px 10px}
.rq-on{background:rgba(212,176,106,.07);border-left:3px solid var(--gold)}
input.rq-c{width:104px;flex:none;min-height:52px;padding:10px 12px;background:var(--sup);border:1px solid var(--line-hi);border-radius:0;font-size:20px;text-align:right}
input.rq-nt{margin-top:8px;min-height:44px;font-size:16px}
.rq-bn{margin-top:4px;min-height:40px;padding:6px 0;border:0;background:none;color:var(--gold);font-size:15px;text-decoration:underline;text-align:left}


/* ===== Caja de efectivo: bitácora del turno de la cajera (15 nov 2026). Sin colores de alerta: solo registro. ===== */
.tb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tb button{min-height:72px;padding:10px 12px;border:1px solid var(--line-hi);background:none;color:var(--gold-hi);font:600 16px/1.25 var(--f-x);text-align:left;cursor:pointer}
.tb button:active{background:rgba(212,176,106,.1)}
.bt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.bt>div{flex:1;min-width:0}
.bt b{display:block;font-weight:600;font-size:16px;color:var(--fg)}
.bt small{display:block;color:var(--mute);font-size:16px}
.bt .pre{margin:6px 0 0;color:var(--fg2);font-size:16px}
.bt .din{padding-top:2px}
.bt.x b,.bt.x .din{text-decoration:line-through;opacity:.6}
details.bt{display:block;padding:0}
details.bt summary{display:flex;gap:12px;align-items:flex-start;padding:12px 0;cursor:pointer;list-style:none}
details.bt summary::-webkit-details-marker{display:none}
details.bt summary>div{flex:1;min-width:0}
details.bt .tot{padding-left:12px}
details.bt[open] summary{padding-bottom:6px}
.bt .mas{color:var(--gold-hi);font-size:14px}
/* ===== Documento impreso del turno (15 nov 2026): sale en la impresora de la caja. Negro sobre blanco, sin fondos. ===== */
#imp{display:none}
.imp-doc{max-width:80mm;margin:0;padding:0;background:#fff;color:#000;font:13px/1.35 Arial,Helvetica,sans-serif}
.imp-doc p{margin:0}
.imp-doc hr{border:0;border-top:1px dashed #000;margin:8px 0}
.imp-marca{font-weight:700;font-size:15px;text-align:center;letter-spacing:.04em}
.imp-doc .imp-tit{text-align:center;font-weight:700;margin:2px 0 8px}
.imp-l{font-size:12px}
.imp-f{padding:6px 0;border-top:1px dotted #000}
.imp-doc hr+.imp-f{border-top:0}
.imp-nw{white-space:nowrap}
.imp-c{display:flex;justify-content:space-between;gap:8px}
.imp-c b{font-weight:700}
.imp-c b:last-child,.imp-c span:last-child{white-space:nowrap}
.imp-por{font-size:12px}
.imp-doc .imp-tx{margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.imp-d{font-size:12px;padding-left:10px}
.imp-x .imp-c b:last-child{text-decoration:line-through}
.imp-pie{font-size:11px;text-align:center}
.imp-doc .imp-firma{margin-top:30px;border-top:1px solid #000;padding-top:2px;font-size:11px}
@media print{
  @page{margin:3mm}
  :root{color-scheme:light!important} /* la página es oscura: en el papel, nada de fondo */
  html,body{background:#fff!important;color:#000!important;margin:0!important;padding:0!important}
  body>*{display:none!important}
  body>#imp{display:block!important}

  /* ---------- imprimir la bitácora en la impresora de la caja (pedido de Roots, 15 nov 2026) ----------
     La cajera pide el documento desde su teléfono (caja_imprimir). El computador de la caja tiene la app abierta
     en la pantalla «Impresora de la caja» (se abre con ?impresora=1 en la dirección): pregunta cada 4 segundos,
     toma lo que haya (caja_impresion_siguiente) y lo imprime. El documento es la bitácora en orden: sin sumas,
     sin restas y sin comparar con DataE (§0.A). */
  var IMPRESORA = 'rootsImpresoraCaja', IMP_HORAS = 12;
  function leeImpresora() {
    var pide = /[?&]impresora(=1)?(&|$)/.test(location.search);
    try { if (pide) localStorage.setItem(IMPRESORA, '1'); return localStorage.getItem(IMPRESORA) === '1'; } catch (x) { return pide; }
  }
  function puedeImprimirUltimo() {
    var u = S.t.ultimo;
    return !!(u && S.ses && u.cerrada_ts && u.cerrada_por === S.ses.nombre && Date.now() - new Date(u.cerrada_ts).getTime() < IMP_HORAS * 3600000);
  }
  function bloqueImprimir(t, arriba) {
    var p = S.imp, b = '';
    if (!(p && p.enviada && !p.impresa)) /* si ya va en camino no se pide otra copia */
      b = '<div class="acc" style="margin-top:' + arriba + 'px"><button type="button" class="b2" data-a="tImprimir">' + e(p && p.impresa ? 'Imprimir otra vez' : t) + '</button></div>';
    return b + lineaImpresion();
  }
  function lineaImpresion() {
    var p = S.imp; if (!p || !p.enviada) return '';
    if (p.impresa) return '<p class="nota" role="status">Salió en la impresora de la caja a las ' + e(hora(p.impresa)) + '</p>'; /* la hora ya termina en «p. m.» */
    if (p.tarde) return '<p class="aviso" role="status">La impresora de la caja todavía no lo saca. Revisa que el computador de la caja tenga abierta la ventana «Impresora de la caja». Sale apenas la abran.</p>';
    return '<p class="nota" role="status">Enviado a la impresora de la caja. Sale en unos segundos.</p>';
  }
  function revisarImpresion() { /* el teléfono pregunta si su pedido ya salió */
    var p = S.imp; if (!p || !p.enviada || p.impresa) return Promise.resolve();
    if (Date.now() - p.desde > IMP_HORAS * 3600000) { S.imp = null; return Promise.resolve(); }
    return rpc('caja_impresion_estado', tk({ p_id: p.id })).then(function (j) {
      if (j && j.impresa_ts) { p.impresa = j.impresa_ts; refrescar(); }
      else if (!p.tarde && Date.now() - p.desde > 45000) { p.tarde = true; refrescar(); }
    }).catch(function () {});
  }
  function filaImp(x) {
    var t = TIPO_T[x.tipo] || x.tipo, v = '', det = '', cls = 'imp-f';
    if (x.tipo === 'novedad') det = '<p class="imp-tx">' + e(x.texto) + '</p>';
    else if (x.tipo === 'salida') {
      v = plata(x.valor);
      det = '<p class="imp-tx">' + e(x.concepto) + (x.anulada ? ' · ANULADA' + (x.anulada_por ? ' por ' + e(x.anulada_por) : '') : '') + '</p>';
      if (x.anulada) cls += ' imp-x';
    } else {
      v = plata(x.total);
      det = x.solo_total ? '<p class="imp-tx">Solo el total</p>' : Object.keys(x.conteo || {}).sort(function (a, b) { return b - a; }).map(function (d) {
        return '<div class="imp-c imp-d"><span>' + e(x.conteo[d]) + ' × ' + plata(+d) + '</span><span>' + plata(d * x.conteo[d]) + '</span></div>';
      }).join('');
    }
    return '<div class="' + cls + '"><div class="imp-c"><b>' + e(hora(x.ts)) + ' · ' + e(t) + '</b><b>' + v + '</b></div><p class="imp-por">' + e(x.por) + '</p>' + det + '</div>';
  }
  function docTurno(j) {
    var tu = j.turno || {}, b = j.bitacora || [];
    var h = '<div class="imp-doc"><p class="imp-marca">ROOTS LAGOS CAFÉ</p><p class="imp-tit">Bitácora del turno de caja</p>';
    var cuando = function (ts) { return '<span class="imp-nw">' + e(diaHora(ts)) + '</span>'; }; /* la fecha y la hora no se parten */
    h += '<p class="imp-l">Abrió: ' + e(tu.abierta_por) + ' · ' + cuando(tu.abierta_ts) + '</p>';
    h += tu.cerrada_ts ? '<p class="imp-l">Cerró: ' + e(tu.cerrada_por) + ' · ' + cuando(tu.cerrada_ts) + '</p>' : '<p class="imp-l">El turno sigue abierto</p>';
    h += '<p class="imp-l">Impreso: ' + cuando(j.impresa_ts || new Date().toISOString()) + ' · lo pidió ' + e(j.pedida_por) + '</p><hr>';
    h += b.length ? b.map(filaImp).join('') : '<p class="imp-tx">Todavía no hay nada anotado en este turno.</p>';
    if (tu.nota) h += '<p class="imp-tx" style="margin-top:8px"><b>Nota del cierre:</b> ' + e(tu.nota) + '</p>';
    return h + '<hr><p class="imp-pie">Solo registro. La venta y el cuadre siguen en DataE.</p><p class="imp-firma">Entrega</p><p class="imp-firma">Recibe</p></div>';
  }
  function docPrueba() {
    return '<div class="imp-doc"><p class="imp-marca">ROOTS LAGOS CAFÉ</p><p class="imp-tit">Prueba de la impresora de la caja</p><p class="imp-l">' + e(diaHora(new Date().toISOString())) + '</p><hr><p class="imp-tx">Si lees esto, la impresora de la caja quedó lista.</p></div>';
  }
  function imprimir(html) {
    document.getElementById('imp').innerHTML = html; /* se queda escondido en pantalla; solo se ve en el papel */
    try { window.print(); } catch (x) {}
  }
  function tickImpresora() {
    if (S.impOcupada) return Promise.resolve();
    S.impOcupada = true;
    var antes = S.red;
    return rpc('caja_impresion_siguiente', tk()).then(function (j) {
      S.red = true; S.impOcupada = false;
      if (j && j.id) {

      }
      if (!antes) pintar();
    }).catch(function (x) {
      S.impOcupada = false;
      if (x && x.message === 'sesion') return cerrarSesion('Tu sesión terminó. Entra otra vez.');
      if (S.red) { S.red = false; pintar(); }

  }
  function vImpresora() {
    var h = cab('Impresora de la caja'), l = S.impLista;
    h += '<p class="sub" style="margin-top:16px">' + (S.red ? '<span class="est ok">Encendida</span> ' : '<span class="est">Sin conexión</span> Cuando vuelva el internet, imprime lo que esté en espera. ') + 'Deja esta ventana abierta en este computador. Lo que la cajera mande a imprimir sale aquí solo.</p>';
    h += '<p class="et">Impreso en esta ventana</p>';
    h += l.length ? l.slice().reverse().map(function (x) { return '<div class="bt"><div><b>' + e(x.t) + '</b><small>' + e(hora(x.ts)) + (x.por ? ' · lo pidió ' + e(x.por) : '') + '</small></div></div>'; }).join('') : '<p class="vacio">Todavía no ha salido nada.</p>';
    h += '<div class="acc" style="margin-top:20px"><button type="button" class="b2" data-a="impPrueba">Imprimir una prueba</button><button type="button" class="b3" data-a="impApagar">Dejar de usar este computador como impresora</button></div>';
    return h + '<p class="nota">Si cada vez sale una ventana para elegir la impresora, avísale a Roots: falta preparar el acceso directo de este computador.</p>';
  }

  /* ---------- pintar ---------- */
  function pintar() {
    var y = window.scrollY, html;
    if (!S.ses) html = vAcceso();
    else if (S.v === 'clave') html = vClave();
    else if (esDueno()) html = pintarDueno();
    else if (esSebas()) html = vDNomina();
    else if (esCajera() && S.impresora) html = vImpresora(); // el computador de la caja (15 nov 2026)
    else if (esCajera()) {
      if (!S.t.pedidos && VISTAS_PEDIDOS.indexOf(S.v) >= 0) S.v = 'caja'; // pantallas viejas apagadas por Roots (D3, 10 nov 2026)
      html = ({ miturno: vMiTurno, caja: vTurno, tconteo: vTurnoConteo, tsalida: vTurnoSalida, tnovedad: vTurnoNovedad, perfil: vPerfil, verificar: vVerificar, mesas: vLista, cajaventas: vCaja, nueva: vNueva, detalle: vDetalle, prod: vProductos, mover: vMover, dividir: vDividir, cobro: vCobro, conteo: vConteo, cierres: vCierres }[S.v] || vTurno)();
    }
    else html = ({ miturno: vMiTurno, lista: vLista, nueva: vNueva, detalle: vDetalle, prod: vProductos, barra: vBarra, perfil: vPerfil, mover: vMover, dividir: vDividir }[S.v] || vLista)();
    $app.innerHTML = html; window.scrollTo(0, y);
  }
  function ir(v) { S.v = v; S.conf = null; if (v === 'miturno') { S.mt.conf = null; if (!esDueno() && !esSebas()) cargarMiTurno(true); } pintar(); window.scrollTo(0, 0); if (esDueno()) tickDueno(true); else if (esSebas()) tickSebas(true); }
  function refrescar() { // llega un cambio de otro teléfono: no interrumpir a quien está escribiendo o eligiendo productos
    var a = document.activeElement;
    if (S.v === 'prod' || S.v === 'clave' || S.v === 'cierres' || (S.v === 'tconteo' && S.tc && S.tc.conf) || (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT') && a.type !== 'checkbox' && $app.contains(a))) return;
    pintar();
  }
  function copiar(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { aviso('Resumen copiado'); }, function () { mostrarTexto(t); }); else mostrarTexto(t);
  }
  function mostrarTexto(t) { $app.insertAdjacentHTML('beforeend', '<label class="lab">Copia este texto<textarea id="txtRes" rows="10">' + e(t) + '</textarea></label>'); var x = document.getElementById('txtRes'); x.focus(); x.select(); }

  /* ---------- sincronía ---------- */
  function cargarCarta() { return rpc('carta', tk()).then(function (c) { c.tasa = Number(c.tasa); S.carta = c; }); }
  function tick(forzar) {
    if (S.ses && S.impresora && esCajera()) return tickImpresora(); // la impresora pregunta aunque la ventana esté detrás de DataE
    if (!S.ses || (document.hidden && !forzar)) return Promise.resolve();
    if (S.v === 'miturno' && !esDueno() && !esSebas()) cargarMiTurno(forzar);
    if (esDueno()) return tickDueno(forzar);
    if (esSebas()) return tickSebas(forzar);
    var antes = S.red, cambioT = false;
    // la cajera primero trae su bitácora; las pantallas de pedidos solo si Roots las tiene a la vista
    var pt = esCajera() ? rpc('caja_turno', tk({ p_rev: S.t.r })).then(function (t) {
      if (t && t.denom) { S.t = { r: t.r, turno: t.turno, ultimo: t.ultimo, denom: t.denom, pedidos: !!t.pedidos, cargado: true }; cambioT = true; }
    }).then(revisarImpresion) : Promise.resolve();
    return pt.then(function () {
      if (esCajera() && !S.t.pedidos) {
        S.red = true; S.cargado = true; S.alertas = []; pintaAlerta(); document.title = 'Comandas Roots';
        if (cambioT || !antes) refrescar();
        return;
      }
      return rpc('estado', tk({ p_rev: S.d.r })).then(function (j) {
        S.red = true;
        var cambio = cambioT;
        if (j.comandas && j.r >= S.d.r) { S.d = j; cambio = true; }
        S.cargado = true;
        var p = (!S.carta || (j.cv && S.carta.v !== j.cv)) ? cargarCarta() : Promise.resolve();
        return p.then(function () {
          if (esCajera()) {
            var n = pendientes(), co = cobrosPorVerificar().length;
            if (S.pendAnt !== null && co > S.pendAnt) pitar(); // los pedidos suenan con su alerta
            S.pendAnt = co; document.title = (n ? '(' + n + ') ' : '') + 'Comandas Roots';
            revisarAlertas();
          }
          if (cambio || !antes) refrescar();
        });
      });
    }).catch(function (x) {
      if (x.message === 'sesion') return cerrarSesion('Tu sesión terminó. Entra otra vez.');
      if (S.red) { S.red = false; refrescar(); }
    });
  }
  function cargar() { pantallaEncendida(); pintar(); return tick(true); }
  setInterval(tick, CADA_MS);
  setInterval(function () { if (esCajera() && S.alertas.length && !document.hidden) sonarNueva(); }, 15000); // insiste hasta que la atiendan
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { pantallaEncendida(); tick(true); } });

  /* ---------- acciones ---------- */
  function confirmar() {
    var ks = Object.keys(S.draft); if (!ks.length) return;
    var items = ks.map(function (k) { var d = S.draft[k], i = { k: k, q: d.q }; if (d.nota && d.nota.trim()) i.nota = d.nota.trim(); return i; });
    var n = S.nueva, destino = n ? n.mesa : comanda(S.id).mesa;
    if (!S.envio) S.envio = { ronda: uuid(), comanda: n ? uuid() : S.id }; // el mismo id si se reintenta: no se duplica
    hacer(function () { return rpc('agregar_pedido', tk({ p_ronda: S.envio.ronda, p_comanda: S.envio.comanda, p_mesa: n ? n.mesa : '', p_cliente: n ? (n.cliente || '') : '', p_items: items })); }).then(function (v) {
      if (!v) return;
      S.id = S.envio.comanda; S.envio = null; S.nueva = null; S.draft = {}; S.q = ''; ir('detalle'); aviso((esCajera() ? 'Listo · ' : 'Enviado a caja · ') + destino);

        return hacer(function () { return rpc('nomina_marcar', tk({ p_tipo: tipo, p_lat: p.coords.latitude, p_lon: p.coords.longitude, p_prec: p.coords.accuracy })); });
      }).then(function (v) { resultadoMarca(v, tipo); }, function (x) { S.mt.bus = false; S.mt.conf = null; aviso(geoTexto(x)); pintar(); });
    },
    dMConf: function (d) { revisarMarca(d.id, 'confirmar'); },
    dMAbrir: function (d) { var x = docV(D.nm.mar, d.id); if (!x) return; D.mq = { id: d.id, modo: d.m, e: x.data.entra || '', s: x.data.sale || '', m: '' }; pintar(); },
    dMNo: function () { D.mq = null; pintar(); },
    dMEnviar: function () {
      var q = D.mq; if (!q) return;
      if (String(q.m || '').trim().length < 3) return aviso('Escribe el motivo (mínimo 3 letras).');
      if (q.modo === 'corregir' && horasN(q.e, q.s) == null) return aviso('Revisa la hora de entrada y la de salida.');
      revisarMarca(q.id, q.modo, q);
    },
    dUbAbrir: function () {
      var u = D.ub, r = parseInt(u.r, 10), hh = parseInt(u.h, 10);
      if (!(r >= 30 && r <= 1000)) return aviso('El radio va de 30 a 1.000 metros.');
      if (!(hh >= 4 && hh <= 24)) return aviso('Las horas máximas van de 4 a 24.');
      u.conf = true; pintar();
    },
    dUbNo: function () { D.ub.conf = false; pintar(); },
    dUbSi: function () {
      var u = D.ub; if (u.bus) return;
      var r = parseInt(u.r, 10), hh = parseInt(u.h, 10);
      u.bus = true; pintar();
      ubicar().then(function (p) {
        return hacer(function () { return rpc('dueno_nomina_ubicacion', tk({ p_lat: p.coords.latitude, p_lon: p.coords.longitude, p_prec: p.coords.accuracy, p_radio: r, p_max_horas: hh })); }, 'Café fijado. Ya se puede marcar.');
      }).then(function () { u.bus = false; u.conf = false; pintar(); }, function (x) { u.bus = false; u.conf = false; aviso(geoTexto(x)); pintar(); });
    }
  };
  Object.assign(A, AM);
  var AO = {
    dOrdAbrir: function () { D.og.conf = true; pintar(); },
    dOrdNo: function () { D.og.conf = false; pintar(); },
    dOrdSi: function () {
      var lun = D.sem, o = ordenDe(lun, D.og.festivo);
      if (o.bloqueos.length) return aviso(o.bloqueos[0]);
      var foto = fotoOrden(o);
      if (!cuadraOrden(foto)) return aviso('Las cifras no cuadran. No se emitió nada.');
      D.og.bus = true; pintar();
      hacer(function () {
        return rpc('nube_guardar', tk({ p_coleccion: 'nomina.liquidaciones', p_id: lun, p_data: foto, p_version: null })).catch(function (x) {
          /* choque de versión, o dos personas que insertan a la vez (las dos ven «no existe»): solo aquí quiere decir «ya la emitieron» */
          if (x && (x.message === 'version' || /duplicate key/.test(x.message || ''))) throw new Error('orden_ya_emitida');
          throw x;
        });
      }, 'Orden guardada · ' + foto.ref).then(function (ok) {
        D.og.bus = false; D.og.conf = false;
        if (!ok) { (esSebas() ? tickSebas(true) : tickDueno(true)).then(function () { pintar(); }); return; } /* alguien la emitió primero: se recarga y queda la guardada para bajar */
        pintar(); bajarOrden(foto);
      });
    },
    dOrdBajar: function () { var l = docDe(D.nm.liq, D.sem); if (l) bajarOrden(l); }
  };
  Object.assign(A, AO);
  window.addEventListener('hashchange', function () { if (esDueno() && /^#dueno\/te-necesito/.test(location.hash)) ir('dnecesito'); });
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
    var f = A[b.getAttribute('data-a')]; if (f) f(b.dataset);
  });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.getAttribute('data-f') === 'gasto') {
      var g = S.gasto, val = parseInt(String(g.v).replace(/\D/g, ''), 10);
      if (!g.c.trim()) return aviso(TEXTOS.gasto_concepto);
      if (!(val > 0)) return aviso(TEXTOS.gasto_valor);
      if (!g.id) g.id = uuid(); // el mismo id si se reintenta: no se duplica
      if (document.activeElement) document.activeElement.blur();
      hacer(function () { return rpc('registrar_gasto', tk({ p_id: g.id, p_concepto: g.c, p_valor: val })); }, S.v === 'tsalida' ? 'Salida anotada · ' + plata(val) : 'Gasto registrado').then(function (v) { if (v) { S.gasto = { c: '', v: '', id: null }; if (S.v === 'tsalida') ir('caja'); else pintar(); } });
      return;
    }
    if (ev.target.getAttribute('data-f') === 'tnovedad') {
      var nv = S.tn;
      if (!nv.t.trim()) return aviso(TEXTOS.texto);
      if (!nv.id) nv.id = uuid(); // el mismo id si se reintenta: no se duplica
      if (document.activeElement) document.activeElement.blur();
      hacer(function () { return rpc('caja_turno_novedad', tk({ p_id: nv.id, p_texto: nv.t })); }, 'Novedad anotada').then(function (v) { if (v) { S.tn = { t: '', id: null }; ir('caja'); } });
      return;
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.getAttribute('data-dq')) return inputDueno(t);
    if (t.id === 'busca') { S.q = t.value; repintarProductos(); }
    else if (t.getAttribute('data-nota')) { var d = S.draft[t.getAttribute('data-nota')]; if (d) { d.nota = t.value; tocado(); } }
    else if (t.id === 'cliN' && S.nueva) S.nueva.cliente = t.value;
    else if (t.id === 'cliD' && S.div) S.div.cliente = t.value;
    else if (t.getAttribute('data-pago') && S.cobro) { S.cobro.pagos[t.getAttribute('data-pago')] = t.value; S.cobro.todo = null; pintaCobro(); }
    else if (t.id === 'cobRec' && S.cobro) { S.cobro.recibe = t.value; pintaCobro(); }
    else if (t.id === 'cobCreN' && S.cobro) { S.cobro.credito = t.value; pintaCobro(); }
    else if (t.getAttribute('data-den') && S.cont) {
      var dn = t.getAttribute('data-den'), sal = document.getElementById('dn' + dn), tt = document.getElementById('contT');
      S.cont.c[dn] = t.value; S.cont.id = null; S.cont.cero = false;
      if (sal) sal.textContent = plata((+dn) * digitos(t.value));
      if (tt) tt.textContent = plata(totalConteo());
    }
    else if (t.getAttribute('data-tden') && S.tc) {
      var td = t.getAttribute('data-tden'), ts = document.getElementById('tdn' + td), tt2 = document.getElementById('tcT');
      S.tc.c[td] = t.value; S.tc.id = null; S.tc.cero = false; S.tc.conf = false;
      if (ts) ts.textContent = plata((+td) * digitos(t.value));
      if (tt2) tt2.textContent = plata(totalTurnoConteo());
    }
    else if (t.id === 'tTot' && S.tc) { S.tc.total = t.value; S.tc.id = null; S.tc.cero = false; S.tc.conf = false; var tt3 = document.getElementById('tcT'); if (tt3) tt3.textContent = plata(totalTurnoConteo()); }
    else if (t.id === 'tNota' && S.tc) S.tc.nota = t.value;
    else if (t.id === 'tNov') { S.tn.t = t.value; S.tn.id = null; }
    else if (t.id === 'gasC') { S.gasto.c = t.value; S.gasto.id = null; }
    else if (t.id === 'gasV') { S.gasto.v = t.value; S.gasto.id = null; }
  });
  /* En el computador la clave también se escribe con el teclado: números, borrar y Enter (pedido de Roots, 15 nov 2026).
     Solo en la pantalla de la clave y nunca mientras se escribe en una casilla. */
  document.addEventListener('keydown', function (ev) {
    var enClave = (!S.ses && S.acc.p === 'pin') || (S.ses && S.v === 'clave'), a = document.activeElement;
    if (!enClave || ev.ctrlKey || ev.metaKey || ev.altKey || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
    if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); A.dig({ d: ev.key }); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); A.bor(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); pinOk(); }
  });
  document.addEventListener('change', function (ev) { if (ev.target.getAttribute('data-dq')) return inputDueno(ev.target); if (ev.target.id === 'propC') { if (esCajera()) return cambiaPropina(S.id, ev.target.checked, null); S.prop[S.id] = ev.target.checked; pintar(); }
    else if (ev.target.getAttribute('data-prop')) cambiaPropina(ev.target.getAttribute('data-prop'), ev.target.checked, null);
    else if (ev.target.id === 'propS') cambiaPropina(S.id, ev.target.checked, null);
    else if (ev.target.id === 'propV') cambiaPropina(S.id, true, digitos(ev.target.value));
  });

  /* ---------- aviso de versión nueva (18 nov 2026) ----------
     La página trae su sello (BUILD, puesto por armar.py) y version.json lo repite. Si el de afuera es otro, hay una
     versión nueva publicada: se avisa arriba y se recarga al tocar. No recarga sola (podría borrar lo que se escribe). */
  var BUILD = "0f8727d3d729", AVISO_V = false;
  function revisarVersion() {
    if (AVISO_V || !window.fetch) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.v || j.v === BUILD || AVISO_V) return;
      AVISO_V = true;
      var d = document.getElementById('nueva');
      if (d) { d.innerHTML = '<button type="button">Hay una versión nueva. Toca para recargar.</button>'; d.className = 'on'; }
    }).catch(function () { /* sin señal: se vuelve a preguntar luego */ });
  }
  (function () {
    var d = document.getElementById('nueva');
    if (d) d.addEventListener('click', function () { location.reload(); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) revisarVersion(); });
    setInterval(revisarVersion, 5 * 60000);
    setTimeout(revisarVersion, 4000);
  })();
  /* ---------- tablero de Roots (18 nov 2026) ----------
     Lee SOLO public.dueno_tablero: un resultado por indicador, con su fecha del dato, su origen y un estado que calcula la base.
     La pantalla no suma, no resta y no calcula el estado. Un módulo apagado sale en gris, al final. */
  var ETQ_E = { al_dia: 'Al día', viejo: 'Viejo', sin_dato: 'Sin dato', apagado: 'Apagado' };
  var IR_MOD = { caja: 'dmes', nomina: 'dnomina', compras: 'dpedido', carta: 'dagotados' }; /* a dónde lleva tocar la tarjeta */
  function valorTab(r) {
    if (typeof r.valor === 'number') {
      if (r.unidad === 'COP') return pesosN(r.valor);
      if (r.unidad === 'h') return fhN(r.valor);
      return String(r.valor).replace('.', ',') + (r.unidad ? ' ' + r.unidad : '');
    }
    return r.texto ? r.texto : 'Sin dato';
  }
  function tarjetaTab(m) {
    var on = !!m.encendido, ir = IR_MOD[m.clave], h = '';
    h += '<span class="tabm-h"><span class="pt ' + e(m.estado) + '" aria-hidden="true"></span><b>' + e(m.nombre) + '</b><em>' + e(ETQ_E[m.estado] || m.estado) + '</em>' + (on && ir ? '<i aria-hidden="true">→</i>' : '') + '</span>';
    if (!on) h += '<small>' + e(m.nota || '') + '</small>';
    else (m.resultados || []).forEach(function (r) {
      var sin = r.estado === 'sin_dato' || !r.fecha_dato;
      h += '<span class="tabm-r"><span>' + e(r.titulo) + '</span><b>' + e(sin && typeof r.valor !== 'number' && !r.texto ? 'Sin dato' : valorTab(r)) + '</b></span>' +
        '<small class="' + e(r.estado) + '">' + (sin ? 'sin dato' : 'dato del ' + e(cortoN(String(r.fecha_dato).slice(0, 10))) + ' · ' + e(r.origen)) + (r.estado === 'viejo' ? ' · viejo' : '') + '</small>';
    });
    return on && ir ? '<button type="button" class="tabm ' + e(m.estado) + '" data-a="ir" data-v="' + ir + '">' + h + '</button>' : '<div class="tabm ' + e(m.estado) + '">' + h + '</div>';
  }
  function tableroHtml() {
    var ms = D.tab && D.tab.modulos || [], h = '<p class="et">Cómo va el café</p>';
    ms.filter(function (m) { return m.encendido; }).forEach(function (m) { h += tarjetaTab(m); });
    var off = ms.filter(function (m) { return !m.encendido; });
    if (off.length) { h += '<p class="et">Apagados</p>'; off.forEach(function (m) { h += tarjetaTab(m); }); }
    return h;
  }
  /* ---------- arranque ---------- */
  S.impresora = leeImpresora();
  var guardada = leerSesion();
  if (guardada && guardada.token) {
    S.ses = guardada; S.v = esDueno() ? (D.irA || 'dinicio') : (esSebas() ? 'dnomina' : (esCajera() ? 'caja' : 'lista'));
    cargar();
  } else { if (D.irA) S.acc = Object.assign(ACC0(), { p: 'pin', id: 'dueno' }); pintar(); cargarPerfiles(); }
})();</script>
